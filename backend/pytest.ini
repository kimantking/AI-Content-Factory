[pytest]
testpaths = tests
addopts = -q
asyncio_default_fixture_loop_scope = function
markers =
    integration: end-to-end tests that shell out to ffmpeg and hit Postgres (slower)
    fast: quick unit-level checks safe to run continuously during development
    media: exercises the media / render pipeline
    governance: Phase 7 content-governance suite
    intel: Cross-Phase Intelligence Upgrade suite (URL learning / dataset / prompt / platform selection)
    production: needs real infrastructure / credentials (skipped by default)
    full: only run at a completion gate
    phase9: Phase 9 real-world validation (load / stress / failure / recovery / soak)
    phase10: Phase 10 production v1.0 release (config / kill switches / support snapshot / dashboard)
    phase11: Phase 11 provider connections (Google AI image/video + ElevenLabs TTS)
    smoke: Phase 9 smoke tier — fast end-to-end sanity
    load: Phase 9 concurrent-load tier
    failure: Phase 9 failure-injection tier
    recovery: Phase 9 failure-recovery tier
    soak: Phase 9 soak tier (long-running; opt-in)
    browser_e2e: Phase 9 browser end-to-end (Playwright; opt-in)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
