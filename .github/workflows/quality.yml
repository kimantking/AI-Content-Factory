name: Code quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install ruff==0.12.12
      - run: python -m ruff check backend/app
      - run: python -m compileall -q backend/app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  integration-video:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: acf
          POSTGRES_PASSWORD: acf
          POSTGRES_DB: acf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acf -d acf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      MOCK_MODE: "true"
      RUN_INLINE: "true"
      DATABASE_URL: postgresql+psycopg://acf:acf@localhost:5432/acf
      SYNC_DATABASE_URL: postgresql://acf:acf@localhost:5432/acf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: cd backend && alembic upgrade head
      - name: Pipeline, real MP4 render, playback metadata and deletion
        run: >-
          python -m pytest -q
          backend/tests/test_providers.py
          backend/tests/test_pipeline_integration.py
          backend/tests/phase9/test_smoke.py
          backend/tests/media/test_integration.py::test_short_video_end_to_end_fallback_path
          backend/tests/video/test_pipeline_integration.py::test_creative_plan_and_video_qa_flow_through_media_pipeline
          backend/tests/library/test_library_api.py
