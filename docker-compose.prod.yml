# Production overlay:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Drops dev volume mounts / hot-reload, adds resource limits, healthchecks,
# non-root, restart policy, queue-split workers, and an optional Caddy TLS proxy.
#
# REQUIRES a real environment (secrets, domain, TLS). Without it this is
# CODE READY / NEEDS_PRODUCTION_ENVIRONMENT — see docs/DEPLOYMENT_CHECKLIST.md.

x-app-env: &app-env
  APP_ENV: production
  DATABASE_URL: postgresql+psycopg://acf:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/acf
  SYNC_DATABASE_URL: postgresql://acf:${POSTGRES_PASSWORD}@postgres:5432/acf
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  ACF_MASTER_KEY: ${ACF_MASTER_KEY:?set ACF_MASTER_KEY}
  MOCK_MODE: "false"
  DRY_RUN: "true"
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:?comma/JSON list of allowed origins}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:?allowed hostnames}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?https base url}
  OAUTH_CALLBACK_BASE_URL: ${OAUTH_CALLBACK_BASE_URL:?https callback base}
  PG_DUMP_CMD: pg_dump
  PG_RESTORE_CMD: pg_restore
  LOG_LEVEL: INFO

x-restart: &restart
  restart: unless-stopped

x-worker: &worker
  <<: *restart
  build:
    context: ./backend
    args: { APP_VERSION: "0.5.0-phase5" }
  environment: *app-env
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  deploy:
    resources:
      limits: { cpus: "1.5", memory: 2g }

services:
  postgres:
    <<: *restart
    environment:
      POSTGRES_USER: acf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: acf
    command: >
      postgres -c max_connections=120 -c shared_buffers=256MB
      -c log_min_duration_statement=1000 -c statement_timeout=60000
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: []
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }

  redis:
    <<: *restart
    command: >
      redis-server --requirepass ${REDIS_PASSWORD}
      --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    ports: []
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 640m }

  backend:
    <<: *restart
    build:
      context: ./backend
      args: { APP_VERSION: "0.5.0-phase5" }
    environment: *app-env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-server-header --workers 2"
    read_only: false
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }

  # queue-split workers (base `worker` is overridden into worker-core)
  worker:
    <<: *worker
    command: celery -A app.celery_app.celery_app worker -Q celery,publish -c 2 --loglevel=info --beat
  worker-media:
    <<: *worker
    command: celery -A app.celery_app.celery_app worker -Q image,video,audio,render -c 2 --loglevel=info
    deploy:
      resources:
        limits: { cpus: "2", memory: 3g }
  worker-analytics:
    <<: *worker
    command: celery -A app.celery_app.celery_app worker -Q analytics -c 2 --loglevel=info
  worker-autopilot:
    <<: *worker
    command: celery -A app.celery_app.celery_app worker -Q autopilot -c 1 --loglevel=info

  frontend:
    <<: *restart
    environment:
      NEXT_PUBLIC_API_BASE: ${PUBLIC_BASE_URL}
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }

  # optional TLS reverse proxy (profile: proxy)
  caddy:
    image: caddy:2
    profiles: ["proxy"]
    <<: *restart
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [backend, frontend]

volumes:
  pgdata:
  redisdata:
  caddydata:
